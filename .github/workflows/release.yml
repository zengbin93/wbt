name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.platform.os }}-${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64
            interpreter: "-i python3.12"
          - os: ubuntu-latest
            target: aarch64
            interpreter: "-i python3.12"
          - os: windows-latest
            target: x86_64
            interpreter: ""
          - os: macos-latest
            target: x86_64
            interpreter: ""
          - os: macos-latest
            target: aarch64
            interpreter: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist ${{ matrix.platform.interpreter }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.os == 'ubuntu-latest' && '2_28' || 'auto' }}
          working-directory: python
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: python/dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install maturin
        working-directory: python
        run: python -m pip install maturin
      - name: Build sdist
        working-directory: python
        run: python -m maturin sdist --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: python/dist/*.tar.gz

  verify-distributions:
    name: Verify distribution metadata
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist/
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - run: python .github/release/validate_artifacts.py metadata --directory dist

  verify-wheels:
    name: Verify installed wheel (${{ matrix.runner }})
    needs: build-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: wheels-ubuntu-latest-x86_64
          - runner: ubuntu-24.04-arm
            artifact: wheels-ubuntu-latest-aarch64
          - runner: windows-latest
            artifact: wheels-windows-latest-x86_64
          - runner: macos-15-intel
            artifact: wheels-macos-latest-x86_64
          - runner: macos-latest
            artifact: wheels-macos-latest-aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - run: python .github/release/test_validate_artifacts.py
      - run: python .github/release/validate_artifacts.py runtime --directory dist

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, verify-distributions, verify-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
